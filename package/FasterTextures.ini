; Faster Textures. Read when the game starts.

[Streamer]
; Loads textures small first and fetches the rest in the background, for shorter
; loading screens. Textures look soft until their detail arrives.
; 0: off. 1: change nothing, log how long each loading screen spends on textures.
; 2: load small first. Beside Skyrim Performance Solution's texture streaming, the
; textures it can manage are then left to it. Stays at 1 beside Texture Downscaler,
; which fixes these textures' sizes.
Mode=2
; Loads textures small first behind loading screens. 1: shorter loading screens, and
; textures look soft for a moment afterwards. 0: textures are sharp when a loading
; screen ends, and loading screens take longer. The mod's MCM menu sets the same
; thing, and wins over this file.
bSmallOnLoadingScreens=1
; Loads textures small first while you play. 1: less stutter from large textures, and
; new objects can look soft for a moment. 0: they load at full size, as usual.
bSmallDuringPlay=1
; Top mips a load leaves out. 2 leaves out about 94% of a texture. 1 to 4.
SkipMips=2
; The longer side of what loads small stays at least this. 64 to 4096.
MinEdge=512
; Textures that would save less than this load whole. Loading them twice would
; cost more than it saves.
MinSavedKiB=256
; Keeps the small mips of archive entries that cannot be read from their end, most
; of the base game's large textures, in a folder of their own, so those load small
; too. Takes about a seventh of the size of the texture archives it covers.
Cache=1
; Fills that folder in the background, at low priority, rather than only as textures
; load. So even the first visit to a place gains. 0 keeps only what has loaded.
CacheFill=1
; Where it goes. Empty: "FasterTextures Cache" beside the game, which is on the
; same disk as the archives, or the user's local app data if that cannot be written.
CacheFolder=
; How much of the full textures may start uploading per frame, to keep frames even
; while they arrive. It starts lower right after a loading screen and pauses after a
; late frame. Lower is smoother and slower. 0 is no limit.
UploadMiBPerFrame=16
; How many replaced small textures are let go per frame, to be freed in the
; background. 0 is no limit.
ReleasesPerFrame=4
; Threads that fetch full textures after a loading screen. 2 brings them in a little
; sooner than 1; more gained nothing measurable. 1 to 8.
UpgradeWorkers=2
; Parts of a texture's path that always load whole, separated by commas. Characters
; are here because mods build skin overlays from those textures as they load.
Exclude=interface\,\maps\,mapmarker,\lod\,terrain\,fonts\,book,\sky\,effects\,cubemaps\,actors\character\
; Parts of a path that also load whole while a mod that copies armor textures as they
; load is installed (RaceMenu, Mu Dynamic NormalMap, Material Swapper Framework,
; Fitting Room). Their copies would otherwise keep the small size. Empty: never.
ArmorExclude=armor\,clothes\,clothing\
